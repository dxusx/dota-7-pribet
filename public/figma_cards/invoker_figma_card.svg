<?xml version="1.0" encoding="UTF-8"?>
<svg width="4200" height="6200" viewBox="0 0 4200 6200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Card Background -->
  <rect width="4200" height="6200" rx="60" fill="#11141c" />
  <rect x="30" y="30" width="4140" height="6140" rx="45" stroke="#fbbf24" stroke-width="20" stroke-opacity="0.6" />

  <!-- Header Header -->
  <text x="150" y="320" font-family="Inter, sans-serif" font-size="90" font-weight="bold" fill="#fbbf24" letter-spacing="10">DOTA 2</text>
  <text x="150" y="550" font-family="Inter, sans-serif" font-size="240" font-weight="900" fill="#ffffff">Invoker</text>
  <text x="150" y="720" font-family="Inter, sans-serif" font-size="110" font-style="italic" fill="#94a3b8">The Arsenal Magus / Древнейший Магистр</text>

  <!-- Level Badge -->
  <g transform="translate(3750, 150)">
    <circle cx="160" cy="160" r="150" fill="#047857" stroke="#34d399" stroke-width="15" />
    <text x="160" y="215" font-family="Inter, sans-serif" font-size="160" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  </g>

  <!-- Skills -->
  
      <!-- Skill 1 -->
      <g transform="translate(150, 1200)">
        <rect width="3900" height="420" rx="30" fill="#0d1117" stroke="#30363d" stroke-width="6" />
        <text x="60" y="110" font-family="Inter, sans-serif" font-size="130" font-weight="bold" fill="#e6edf3">Скилл 1 “Quas / Wex / Exort”</text>
        <text x="60" y="240" font-family="Inter, sans-serif" font-size="95" fill="#8b949e">
          <tspan x="60" dy="0">Сферы льда, молнии и огня. Quas дает регенерацию HP, Wex дает скорость,</tspan>
          <tspan x="60" dy="120">Exort увеличивает урон атак и заклинаний. Каст: мгновенно. 0 маны.</tspan>
        </text>
      </g>
    
      <!-- Skill 2 -->
      <g transform="translate(150, 1700)">
        <rect width="3900" height="420" rx="30" fill="#0d1117" stroke="#30363d" stroke-width="6" />
        <text x="60" y="110" font-family="Inter, sans-serif" font-size="130" font-weight="bold" fill="#e6edf3">Скилл 2 “Sun Strike [EEE]”</text>
        <text x="60" y="240" font-family="Inter, sans-serif" font-size="95" fill="#8b949e">
          <tspan x="60" dy="0">Глобальный луч солнца в ЛЮБУЮ точку всей 2D карты: 120/240/360/480 ЧИСТОГО урона!</tspan>
          <tspan x="60" dy="120">Игнорирует всю броню цели. Применение 2 сек. 150 маны. Перезарядка 20 сек.</tspan>
        </text>
      </g>
    
      <!-- Skill 3 -->
      <g transform="translate(150, 2200)">
        <rect width="3900" height="420" rx="30" fill="#0d1117" stroke="#30363d" stroke-width="6" />
        <text x="60" y="110" font-family="Inter, sans-serif" font-size="130" font-weight="bold" fill="#e6edf3">Скилл 3 “Chaos Meteor [EEW]”</text>
        <text x="60" y="240" font-family="Inter, sans-serif" font-size="95" fill="#8b949e">
          <tspan x="60" dy="0">Обрушивает метеорит, катящийся вперед на 8 клеток: 150/250/350 урона при падении</tspan>
          <tspan x="60" dy="120">плюс периодическое горение 50/сек на 4 сек. Каст 1.5 сек. 175 маны. КД 40 сек.</tspan>
        </text>
      </g>
    
      <!-- Skill 4 -->
      <g transform="translate(150, 2700)">
        <rect width="3900" height="420" rx="30" fill="#0d1117" stroke="#30363d" stroke-width="6" />
        <text x="60" y="110" font-family="Inter, sans-serif" font-size="130" font-weight="bold" fill="#e6edf3">Скилл 4 “Deafening Blast [QWE]”</text>
        <text x="60" y="240" font-family="Inter, sans-serif" font-size="95" fill="#8b949e">
          <tspan x="60" dy="0">Звуковая волна отталкивает всех врагов на 4 клетки, наносит 80/160/240 урона</tspan>
          <tspan x="60" dy="120">и ПОЛНОСТЬЮ ОБЕЗОРУЖИВАЕТ врагов на 4/6/8 сек! Каст 1 сек. 150 маны. КД 32 сек.</tspan>
        </text>
      </g>
    
      <!-- Skill 5 -->
      <g transform="translate(150, 3200)">
        <rect width="3900" height="420" rx="30" fill="#0d1117" stroke="#30363d" stroke-width="6" />
        <text x="60" y="110" font-family="Inter, sans-serif" font-size="130" font-weight="bold" fill="#e6edf3">Скилл 5 “Tornado [WWQ]”</text>
        <text x="60" y="240" font-family="Inter, sans-serif" font-size="95" fill="#8b949e">
          <tspan x="60" dy="0">Вихрь на 12/16/20/24 клетки. Поднимает врагов в воздух на 2/3/4 сек (неуязвимы и оглушены),</tspan>
          <tspan x="60" dy="120">наносит 80/140/200 урона и развеивает все эффекты. Каст 1 сек. 125 маны. КД 20 сек.</tspan>
        </text>
      </g>
    
      <!-- Skill 6 -->
      <g transform="translate(150, 3700)">
        <rect width="3900" height="420" rx="30" fill="#0d1117" stroke="#30363d" stroke-width="6" />
        <text x="60" y="110" font-family="Inter, sans-serif" font-size="130" font-weight="bold" fill="#e6edf3">Скилл 6 “EMP [WWW]”</text>
        <text x="60" y="240" font-family="Inter, sans-serif" font-size="95" fill="#8b949e">
          <tspan x="60" dy="0">Электромагнитный взрыв в радиусе 4 кл: сжигает 50/100/150/200 маны и наносит чистый урон,</tspan>
          <tspan x="60" dy="120">равный сожженной мане. Восстанавливает 50% маны Инвокеру. Каст 2 сек. КД 24 сек.</tspan>
        </text>
      </g>
    
      <!-- Skill 7 -->
      <g transform="translate(150, 4200)">
        <rect width="3900" height="420" rx="30" fill="#0d1117" stroke="#30363d" stroke-width="6" />
        <text x="60" y="110" font-family="Inter, sans-serif" font-size="130" font-weight="bold" fill="#e6edf3">Скилл 7 “Cold Snap [QQQ]”</text>
        <text x="60" y="240" font-family="Inter, sans-serif" font-size="95" fill="#8b949e">
          <tspan x="60" dy="0">Замораживает противника на 2/4/6/8 сек. При получении любого урона цель повторно</tspan>
          <tspan x="60" dy="120">оглушается на 0.4 сек. Каст 0 сек. 75 маны. КД 12 сек. Активное.</tspan>
        </text>
      </g>
    
      <!-- Skill 8 -->
      <g transform="translate(150, 4700)">
        <rect width="3900" height="420" rx="30" fill="#0d1117" stroke="#fbbf24" stroke-width="12" />
        <text x="60" y="110" font-family="Inter, sans-serif" font-size="130" font-weight="bold" fill="#fbbf24">Ульта “Invoke (Синтез Заклинания)”</text>
        <text x="60" y="240" font-family="Inter, sans-serif" font-size="95" fill="#8b949e">
          <tspan x="60" dy="0">Синтезирует текущие 3 активные сферы в выбранное заклинание (все 10 комбинаций).</tspan>
          <tspan x="60" dy="120">Каст 0 сек. Перезарядка: 8 / 4 / 1 секунда. Мана: 20 / 10 / 0.</tspan>
        </text>
      </g>
    

  <!-- Stats -->
  
    <!-- Stats Block -->
    <g transform="translate(150, 5250)">
      <rect width="3900" height="900" rx="40" fill="#0a0c10" stroke="#30363d" stroke-width="8" />
      <text x="80" y="160" font-family="Inter, sans-serif" font-size="140" font-weight="bold" fill="#fbbf24">ХАРАКТЕРИСТИКИ:</text>
      
      <text x="80" y="340" font-family="Inter, monospace" font-size="105" fill="#e6edf3">
        <tspan x="80" dy="0">ХП: 100 (рег: +2/ход (+Quas))   |   МАНА: 150 (вос: +15/ход)</tspan>
        <tspan x="80" dy="150">УРОН: 45 (+Exort) (период: 4)   |   КРИТ: 75   |   ДАЛЬНОСТЬ: 15 кл</tspan>
        <tspan x="80" dy="150">ПРОБИТИЕ: 10   |   МЕТКОСТЬ: 40% (+Wex)%   |   СКОРОСТЬ: 6 (+Wex) кл</tspan>
        <tspan x="80" dy="150">БРОНЯ: 2   |   ЛОВКОСТЬ: 2</tspan>
      </text>
    </g>
  
</svg>