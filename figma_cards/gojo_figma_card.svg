<?xml version="1.0" encoding="UTF-8"?>
<svg width="4200" height="6200" viewBox="0 0 4200 6200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Card Background -->
  <rect width="4200" height="6200" rx="60" fill="#090d16" />
  <rect x="30" y="30" width="4140" height="6140" rx="45" stroke="#38bdf8" stroke-width="20" stroke-opacity="0.6" />

  <!-- Header Header -->
  <text x="150" y="320" font-family="Inter, sans-serif" font-size="90" font-weight="bold" fill="#38bdf8" letter-spacing="10">JUJUTSU KAISEN</text>
  <text x="150" y="550" font-family="Inter, sans-serif" font-size="240" font-weight="900" fill="#ffffff">Satoru Gojo</text>
  <text x="150" y="720" font-family="Inter, sans-serif" font-size="110" font-style="italic" fill="#94a3b8">The Honored One / Сильнейший Маг Современности</text>

  <!-- Level Badge -->
  <g transform="translate(3750, 150)">
    <circle cx="160" cy="160" r="150" fill="#047857" stroke="#34d399" stroke-width="15" />
    <text x="160" y="215" font-family="Inter, sans-serif" font-size="160" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  </g>

  <!-- Skills -->
  
      <!-- Skill 1 -->
      <g transform="translate(150, 1200)">
        <rect width="3900" height="420" rx="30" fill="#0d1117" stroke="#30363d" stroke-width="6" />
        <text x="60" y="110" font-family="Inter, sans-serif" font-size="130" font-weight="bold" fill="#e6edf3">Скилл 1 “Infinity (Бесконечность)”</text>
        <text x="60" y="240" font-family="Inter, sans-serif" font-size="95" fill="#8b949e">
          <tspan x="60" dy="0">Пространство вокруг Годжо делится: любые атаки и снаряды замедляются перед попаданием.</tspan>
          <tspan x="60" dy="120">Снижает входящий урон на 50/60/70/80% и дает 40% шанса уклонения. Пассивное.</tspan>
        </text>
      </g>
    
      <!-- Skill 2 -->
      <g transform="translate(150, 1700)">
        <rect width="3900" height="420" rx="30" fill="#0d1117" stroke="#30363d" stroke-width="6" />
        <text x="60" y="110" font-family="Inter, sans-serif" font-size="130" font-weight="bold" fill="#e6edf3">Скилл 2 “Lapse: Blue (Синий: Схождение)”</text>
        <text x="60" y="240" font-family="Inter, sans-serif" font-size="95" fill="#8b949e">
          <tspan x="60" dy="0">Точка сжатия пространства: стягивает всех врагов в радиусе 3 клеток к центру</tspan>
          <tspan x="60" dy="120">и наносит 60/120/180/240 урона. Применение 1 сек. 50/75/100/125 ПЭ. КД 16/12/8/4 сек.</tspan>
        </text>
      </g>
    
      <!-- Skill 3 -->
      <g transform="translate(150, 2200)">
        <rect width="3900" height="420" rx="30" fill="#0d1117" stroke="#30363d" stroke-width="6" />
        <text x="60" y="110" font-family="Inter, sans-serif" font-size="130" font-weight="bold" fill="#e6edf3">Скилл 3 “Reversal: Red (Красный: Расхождение)”</text>
        <text x="60" y="240" font-family="Inter, sans-serif" font-size="95" fill="#8b949e">
          <tspan x="60" dy="0">Колоссальная сила отталкивания обратной энергии: отбрасывает цель на 6 клеток назад</tspan>
          <tspan x="60" dy="120">с уроном 70/140/210/280. Применение 1 сек. 60/85/110/135 ПЭ. КД 16/12/8/4 сек.</tspan>
        </text>
      </g>
    
      <!-- Skill 4 -->
      <g transform="translate(150, 2700)">
        <rect width="3900" height="420" rx="30" fill="#0d1117" stroke="#30363d" stroke-width="6" />
        <text x="60" y="110" font-family="Inter, sans-serif" font-size="130" font-weight="bold" fill="#e6edf3">Скилл 4 “Hollow Purple (Фиолетовый: Аннигиляция)”</text>
        <text x="60" y="240" font-family="Inter, sans-serif" font-size="95" fill="#8b949e">
          <tspan x="60" dy="0">Мнимая масса летит через 15 клеток поля боя и полностью стирает всё на пути:</tspan>
          <tspan x="60" dy="120">150/300/450/600 ЧИСТОГО урона! Пробивает любые укрытия. Каст 2 сек. КД 32/24/16/12 сек.</tspan>
        </text>
      </g>
    
      <!-- Skill 5 -->
      <g transform="translate(150, 3200)">
        <rect width="3900" height="420" rx="30" fill="#0d1117" stroke="#38bdf8" stroke-width="12" />
        <text x="60" y="110" font-family="Inter, sans-serif" font-size="130" font-weight="bold" fill="#fbbf24">Ульта “Domain: Unlimited Void (Необъятная Пустота)”</text>
        <text x="60" y="240" font-family="Inter, sans-serif" font-size="95" fill="#8b949e">
          <tspan x="60" dy="0">Расширение Территории на область 5x5 клеток. В мозг врагов обрушивается бесконечная информация:</tspan>
          <tspan x="60" dy="120">ПОЛНЫЙ ПАРАЛИЧ (100% оглушение) на 8/16/24 сек (1/2/3 хода). Каст 0 сек. КД 120/90/60 сек.</tspan>
        </text>
      </g>
    

  <!-- Stats -->
  
    <!-- Stats Block -->
    <g transform="translate(150, 3750)">
      <rect width="3900" height="900" rx="40" fill="#0a0c10" stroke="#30363d" stroke-width="8" />
      <text x="80" y="160" font-family="Inter, sans-serif" font-size="140" font-weight="bold" fill="#38bdf8">ХАРАКТЕРИСТИКИ:</text>
      
      <text x="80" y="340" font-family="Inter, monospace" font-size="105" fill="#e6edf3">
        <tspan x="80" dy="0">ХП: 120 (рег: +5/ход)   |   МАНА: 200 (вос: +20/ход)</tspan>
        <tspan x="80" dy="150">УРОН: 60 (Black Flash) (период: 4)   |   КРИТ: 120   |   ДАЛЬНОСТЬ: 15 кл</tspan>
        <tspan x="80" dy="150">ПРОБИТИЕ: 25   |   МЕТКОСТЬ: 95%   |   СКОРОСТЬ: 7 кл</tspan>
        <tspan x="80" dy="150">БРОНЯ: 10   |   ЛОВКОСТЬ: 5</tspan>
      </text>
    </g>
  
</svg>