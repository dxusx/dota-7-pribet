<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Antigravity Live Bridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0b0e14;
      color: #e2e8f0;
      padding: 14px;
      font-size: 11px;
      line-height: 1.4;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }
    .title {
      font-weight: 700;
      font-size: 12px;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
    }
    .status-online {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status-offline {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .dot-green { background: #10b981; box-shadow: 0 0 8px #10b981; }
    .dot-red { background: #ef4444; }
    .log-box {
      background: #06080d;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 8px;
      height: 150px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 10px;
      color: #94a3b8;
      margin-bottom: 10px;
    }
    .log-entry { margin-bottom: 3px; word-break: break-all; }
    .log-success { color: #34d399; font-weight: bold; }
    .log-error { color: #f87171; }
    .log-info { color: #38bdf8; }
    button {
      width: 100%;
      background: linear-gradient(135deg, #eab308, #ca8a04);
      color: #000;
      border: none;
      padding: 8px 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">
      <span>⚡ Antigravity AI Bridge</span>
    </div>
    <div id="statusBadge" class="status-badge status-offline">
      <span id="statusDot" class="dot dot-red"></span>
      <span id="statusText">Поиск моста...</span>
    </div>
  </div>

  <div class="log-box" id="logBox">
    <div class="log-entry log-info">[МОСТ] Подключение к http://127.0.0.1:8765...</div>
  </div>

  <button id="manualBtn">🎨 Пересоздать красивые карточки с картинками</button>

  <script>
    const BRIDGE_URL = 'http://127.0.0.1:8765';
    let lastId = 0;
    let isConnected = false;

    const logBox = document.getElementById('logBox');
    const statusBadge = document.getElementById('statusBadge');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const manualBtn = document.getElementById('manualBtn');

    function log(msg, type = 'info') {
      const d = new Date().toLocaleTimeString();
      const div = document.createElement('div');
      div.className = `log-entry log-${type}`;
      div.textContent = `[${d}] ${msg}`;
      logBox.appendChild(div);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function setOnline(online) {
      if (isConnected === online) return;
      isConnected = online;
      if (online) {
        statusBadge.className = 'status-badge status-online';
        statusDot.className = 'dot dot-green';
        statusText.textContent = 'ONLINE';
        log('Соединение с Antigravity AI активно!', 'success');
      } else {
        statusBadge.className = 'status-badge status-offline';
        statusDot.className = 'dot dot-red';
        statusText.textContent = 'OFFLINE';
      }
    }

    function base64ToUint8(b64) {
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr;
    }

    async function fetchAvatarBase64(name) {
      try {
        const res = await fetch(`${BRIDGE_URL}/api/avatar-base64?name=${name}`);
        if (!res.ok) return null;
        const data = await res.json();
        return data.base64 ? base64ToUint8(data.base64) : null;
      } catch (e) {
        log(`Не удалось загрузить аватар ${name}: ${e.message}`, 'error');
        return null;
      }
    }

    async function triggerFullGeneration(cmdId = 1) {
      log('Загрузка портретов Gojo и Sukuna...', 'info');
      const gojoBytes = await fetchAvatarBase64('gojo_avatar.png');
      const sukunaBytes = await fetchAvatarBase64('sukuna_avatar.png');
      const invokerBytes = await fetchAvatarBase64('invoker_avatar.png');

      log('Создание рамок, картинок и структурированных карточек...', 'info');
      parent.postMessage({
        pluginMessage: {
          id: cmdId,
          action: 'GENERATE_FULL_CARDS',
          data: {
            gojoBytes,
            sukunaBytes,
            invokerBytes
          }
        }
      }, '*');
    }

    // Polling loop
    async function poll() {
      try {
        const res = await fetch(`${BRIDGE_URL}/api/poll?lastId=${lastId}`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        setOnline(true);

        if (data.commands && data.commands.length > 0) {
          for (const cmd of data.commands) {
            lastId = Math.max(lastId, cmd.id);
            log(`Получена команда #${cmd.id}: ${cmd.action}`, 'info');
            if (cmd.action === 'GENERATE_FULL_CARDS' || cmd.action === 'CREATE_HEROES') {
              await triggerFullGeneration(cmd.id);
            } else {
              parent.postMessage({ pluginMessage: cmd }, '*');
            }
          }
        }
      } catch (err) {
        setOnline(false);
      }
      setTimeout(poll, 400);
    }

    // Listen to results from code.js
    window.onmessage = async (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'RESULT') {
        log(`Результат #${msg.commandId}: ${msg.message || 'OK'}`, msg.success ? 'success' : 'error');
        try {
          await fetch(`${BRIDGE_URL}/api/result`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(msg)
          });
        } catch (e) {
          console.error(e);
        }
      }
    };

    manualBtn.addEventListener('click', () => {
      triggerFullGeneration(Date.now());
    });

    poll();
  </script>
</body>
</html>
