name: Bug report
description: Сообщить о воспроизводимой проблеме
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Как воспроизвести
      description: Опишите шаги и ожидаемый результат.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактический результат
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Браузер и версия
